name: SIPES CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Backend/**'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sipes_dev
          POSTGRES_PASSWORD: sipes_password
          POSTGRES_DB: sipes_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://sipes_dev:sipes_password@localhost:5432/sipes_test_db?schema=public"
      JWT_SECRET: "test-secret-for-ci"
      NODE_ENV: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Aplicar migraciones a BD de test
        run: npx prisma migrate deploy

      - name: Ejecutar Linter
        run: npm run lint --if-present

      - name: Compilar
        run: npm run build

      - name: Ejecutar Tests Unitarios
        run: npm test --if-present

      - name: Ejecutar Tests E2E
        run: npm run test:e2e --if-present