name: SIPES Backend CI

on:
  push:
    branches: [ main, develop, backend-sublitex ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sipes_dev
          POSTGRES_PASSWORD: sipes_password
          POSTGRES_DB: sipes_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Build
        run: npm run build

      - name: Run Tests
        env:
          DATABASE_URL: "postgresql://sipes_dev:sipes_password@localhost:5432/sipes_test_db?schema=public"
          JWT_SECRET: "ci_jwt_secret_test_key_12345"
        run: npm test
